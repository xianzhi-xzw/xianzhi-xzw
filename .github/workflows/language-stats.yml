name: Update language statistics

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: language-statistics
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test statistics generator
        working-directory: scripts
        run: python -m unittest test_generate_language_stats.py

      - name: Generate language statistics
        env:
          GH_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python scripts/generate_language_stats.py

      - name: Commit updated statistics
        run: |
          if git diff --quiet -- README.md assets/language-stats.svg assets/code-activity.svg; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/language-stats.svg assets/code-activity.svg
          git commit --amend --no-edit
          git push --force-with-lease
